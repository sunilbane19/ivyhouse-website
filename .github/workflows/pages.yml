name: V5 Staging Check (no production deployment)

on:
  push:
    branches: ["v5-pwa"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout V5 staging branch
        uses: actions/checkout@v6
      - name: Verify V5 entry points
        run: |
          test -f index.html
          test -f styles.css
          test -f styles-base.css
          test -f sw.js
          test -f manifest-v5.webmanifest
