<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ivy House — Private Calendar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7f4ed;color:#263b2d;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:25px 16px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font:28px Georgia,serif}.btn{border:1px solid #cfc9bd;background:white;padding:10px 14px;cursor:pointer}.card{background:white;border:1px solid #ddd6ca;padding:20px;margin-top:20px}.hidden{display:none}.login{text-align:center;max-width:480px;margin:80px auto}.input{padding:12px;width:100%;box-sizing:border-box;border:1px solid #ccc;margin:8px 0 12px}.month{font:25px Georgia,serif}.calhead{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:15px}.dow{text-align:center;font-size:11px;color:#777;padding:6px}.day{min-height:55px;border:1px solid #eee;background:#faf9f5;cursor:pointer;text-align:left;padding:7px}.day.blocked{background:#ddd9d0;color:#777}.day.selected{background:#263b2d;color:white}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.msg{margin:10px 0;color:#666}@media(max-width:600px){.fields{grid-template-columns:1fr}.day{min-height:46px}}</style></head><body><div class="wrap"><div class="head"><div class="brand">Ivy House — Private Calendar</div><button class="btn" id="logout" style="display:none">Sign out</button></div><section id="login" class="login card"><h2>Private calendar</h2><p>Sign in with your Google account to manage Ivy House dates.</p><button class="btn" id="google">Sign in with Google</button><div class="msg" id="loginmsg"></div></section><section id="app" class="hidden"><div class="card"><div class="calhead"><button class="btn" id="prev">‹</button><div class="month" id="month"></div><button class="btn" id="next">›</button></div><div class="grid" id="grid"></div><div class="msg" id="msg">Tap a date to select it.</div><div class="fields"><div><label>From</label><input class="input" id="from" type="date"></div><div><label>To</label><input class="input" id="to" type="date"></div></div><input class="input" id="note" placeholder="Private note — only you can see this"><select class="input" id="status"><option value="booked">Confirmed booking</option><option value="blocked">Blocked / unavailable</option></select><button class="btn" id="save">Block dates</button><button class="btn" id="remove" style="display:none">Remove selected block</button><div class="msg" id="result"></div></div></section></div><script>const SUPABASE_URL='https://yiwmtfbqbynimqvwxosu.supabase.co',KEY='sb_publishable_EG30cid4BV1Uvr6EeM3f9g_hztA7Wpu',ADMIN='sunilbane19@gmail.com';const db=supabase.createClient(SUPABASE_URL,KEY);let view=new Date();view.setDate(1);let blocks=[],selectedId=null;const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;function show(id,on){document.getElementById(id).classList.toggle('hidden',!on)}async function init(){const {data:{session}}=await db.auth.getSession();if(session?.user?.email===ADMIN){show('login',false);show('app',true);document.getElementById('logout').style.display='block';load()}else if(session){await db.auth.signOut();show('login',true)}}document.getElementById('google').onclick=async()=>{document.getElementById('loginmsg').textContent='Opening Google…';const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)document.getElementById('loginmsg').textContent=error.message};document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.onAuthStateChange((_,session)=>{if(session?.user?.email===ADMIN){show('login',false);show('app',true);document.getElementById('logout').style.display='block';load()}});async function load(){const {data,error}=await db.from('availability_blocks').select('id,start_date,end_date,status,private_note,created_at').order('start_date');if(error){document.getElementById('result').textContent=error.message;return}blocks=data||[];render()}function render(){const y=view.getFullYear(),m=view.getMonth();document.getElementById('month').textContent=view.toLocaleDateString('en-IN',{month:'long',year:'numeric'});const g=document.getElementById('grid');g.innerHTML=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('');const first=new Date(y,m,1),off=(first.getDay()+6)%7,total=new Date(y,m+1,0).getDate();for(let i=0;i<off;i++)g.innerHTML+='<div></div>';for(let n=1;n<=total;n++){const d=new Date(y,m,n),s=iso(d),b=blocks.find(x=>s>=x.start_date&&s<=x.end_date);const el=document.createElement('button');el.className='day'+(b?' blocked':'');el.textContent=n;el.onclick=()=>{if(b){selectedId=b.id;document.getElementById('from').value=b.start_date;document.getElementById('to').value=b.end_date;document.getElementById('note').value=b.private_note||'';document.getElementById('status').value=b.status;document.getElementById('remove').style.display='inline-block';document.getElementById('msg').textContent='Selected block. You can edit it or remove it.'}else{selectedId=null;document.getElementById('from').value=s;document.getElementById('to').value=s;document.getElementById('note').value='';document.getElementById('remove').style.display='none';document.getElementById('msg').textContent='New block selected.'}};g.appendChild(el)}}document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};document.getElementById('save').onclick=async()=>{const start=document.getElementById('from').value,end=document.getElementById('to').value,note=document.getElementById('note').value,status=document.getElementById('status').value;if(!start||!end||end<start){document.getElementById('result').textContent='Please enter valid dates.';return}const payload={start_date:start,end_date:end,status,private_note:note};let q=selectedId?db.from('availability_blocks').update(payload).eq('id',selectedId):db.from('availability_blocks').insert(payload);const {error}=await q;if(error)document.getElementById('result').textContent=error.message;else{document.getElementById('result').textContent='Saved.';selectedId=null;document.getElementById('remove').style.display='none';await load()}};document.getElementById('remove').onclick=async()=>{if(!selectedId)return;if(!confirm('Remove this block?'))return;const {error}=await db.from('availability_blocks').delete().eq('id',selectedId);if(error)document.getElementById('result').textContent=error.message;else{selectedId=null;document.getElementById('remove').style.display='none';document.getElementById('result').textContent='Removed.';await load()}};init();</script></body></html>
